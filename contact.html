    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">Event Center</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">

                       </ul>

            </nav>
       </header>
        <main>
            <form>
                <div class="container py-5">
                    <h2 class="text-center text-primary py-5">Contact Form</h2>
                    <form class="row g-3 border p-4 shadow-sm bg-light">
                        <div class="col-md-6">
                          <label for="name">Name:</label>
                          <input type="text" class="form-control" id="name" name="name" placeholder="Enter name" required>
                        </div>
                <div class="form-group">
                    <label for="exampleInputEmail1">Email address:</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                  <label for="InputPassword1">Password:</label>
                  <input type="password" class="form-control" id="InputPassword1" placeholder="Enter Password" required>
                </div>
                <div class="form-group">
                    <label for="exampleFormControlTextarea1">Comments:</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                  </div>
                  <div class="form-group">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
              </form>
        </main>
